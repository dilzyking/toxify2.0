<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Fancode</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --red:#ef4444;
}

html[data-theme="dark"] {
  --bg:#0a0a10;
  --surface:#15131d;
  --surface2:#1e1b28;
  --accent:#8b5cf6;
  --accent2:#b794f6;
  --glow:rgba(139,92,246,.28);
  --text:#f5f3fb;
  --muted:#8d8798;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.16);
  --stripe:rgba(139,92,246,.045);
  --stripe-strong:rgba(139,92,246,.065);
  --page-glow:rgba(139,92,246,.025);
}

html[data-theme="light"] {
  --bg:#faf9ff;
  --surface:#fff;
  --surface2:#f3efff;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --glow:rgba(139,92,246,.18);
  --text:#17121f;
  --muted:#6f6780;
  --border:rgba(23,18,31,.08);
  --border-strong:rgba(23,18,31,.14);
  --stripe:rgba(139,92,246,.045);
  --stripe-strong:rgba(139,92,246,.065);
  --page-glow:rgba(139,92,246,.04);
}

*,*::before,*::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  min-height:100%;
  background:var(--bg);
}

body {
  font-family:'Poppins',sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding-bottom:40px;
  transition:background .3s,color .3s;
  background-image:repeating-linear-gradient(
    135deg,
    transparent 0,transparent 18px,
    var(--stripe) 18px,var(--stripe-strong) 20px,
    transparent 20px,transparent 38px
  );
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 20%,var(--page-glow),transparent 45%);
  z-index:0;
}

button,a {
  font:inherit;
}

button {
  -webkit-appearance:none;
}

.page {
  width:100%;
  max-width:520px;
  position:relative;
  z-index:1;
  padding:0 0 20px;
}

/* ===== TOP BAR ===== */
.topbar {
  display:flex;align-items:center;justify-content:space-between;min-height:78px;
  padding:12px 16px;position:relative;gap:10px;
}
.brand-center{position:relative;display:flex;align-items:flex-start;gap:8px}
.brand-live{position:static;background:#ef4444;color:#fff;font-size:8px;font-weight:800;line-height:1;padding:4px 6px;border-radius:5px;letter-spacing:.3px;box-shadow:0 4px 12px rgba(239,68,68,.22);margin-top:-2px}
.top-actions{position:static;display:flex;align-items:center;gap:7px}
.top-action{width:38px;height:38px;border:1px solid rgba(139,92,246,.16);border-radius:50%;background:var(--surface2);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:transform .2s,background .3s,border .3s,box-shadow .3s}
.top-action:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(139,92,246,.12)}
.top-action svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.brand {
  display:flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color:var(--text);
}

.brand .dot {
  width:9px;
  height:9px;
  background:var(--accent);
  border-radius:2px;
  transform:rotate(45deg);
  transition:background .3s;
  box-shadow:0 0 14px var(--glow);
}

.brand .t {
  font-weight:800;
  font-size:17px;
  letter-spacing:.2px;
}

.toggle {
  position:relative;
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--surface2);
  border:1px solid rgba(139,92,246,.16);
  color:var(--accent);
  cursor:pointer;
  transition:background .3s,border .3s,transform .2s,box-shadow .3s;
  box-shadow:0 2px 10px rgba(139,92,246,.06);
}

.toggle:hover {
  transform:translateY(-1px);
  box-shadow:0 5px 16px rgba(139,92,246,.12);
}

.toggle:active {
  transform:scale(.96);
}

.toggle .theme-icon {
  width:22px;
  height:22px;
  display:block;
  color:var(--accent);
  transition:transform .25s,color .3s;
}

html[data-theme="dark"] .toggle {
  background:#211b2d;
  border-color:rgba(139,92,246,.25);
}

html[data-theme="dark"] .toggle .moon-icon {
  display:none;
}

html[data-theme="light"] .toggle .sun-icon {
  display:none;
}

/* ===== PLAYER STAGE ===== */
.stage {
  position:relative;
  width:100%;
  padding-top:56.25%;
  background:#000;
  overflow:hidden;
  border-radius:18px;
  border:1px solid var(--border);
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.stage-tag {
  position:absolute;
  top:10px;
  left:10px;
  z-index:10;
  display:flex;
  align-items:center;
  gap:5px;
  background:var(--red);
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:.5px;
  padding:4px 8px;
  border-radius:6px;
  box-shadow:0 5px 15px rgba(0,0,0,.25);
}

html[data-theme="light"] .stage-tag {
  background:#8b5cf6;
}

.stage-tag .dot {
  width:5px;
  height:5px;
  background:#fff;
  border-radius:50%;
  animation:blink 1.2s infinite;
}

@keyframes blink {
  50% { opacity:.3; }
}

#video {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

/* ===== PLAYER CONTROLS ===== */
.custom-controls {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:8;
  padding:44px 10px 9px;
  background:linear-gradient(to top,rgba(0,0,0,.82),transparent);
  display:flex;
  align-items:center;
  gap:5px;
  opacity:0;
  transform:translateY(4px);
  transition:opacity .2s,transform .2s;
}

.stage:hover .custom-controls,
.stage.controls-visible .custom-controls,
.custom-controls:focus-within {
  opacity:1;
  transform:translateY(0);
}

.control-btn {
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .18s,transform .18s;
  flex:0 0 auto;
}

.control-btn:hover {
  background:rgba(255,255,255,.18);
  transform:translateY(-1px);
}

.control-btn svg {
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.control-spacer {
  flex:1;
}

.live-control {
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:.4px;
  padding:5px 8px;
  border-radius:6px;
  background:rgba(239,68,68,.9);
}

.volume-wrap {
  display:flex;
  align-items:center;
  gap:5px;
}

.volume {
  width:68px;
  accent-color:var(--accent2);
  cursor:pointer;
}

.custom-controls input[type="range"] {
  height:3px;
}

.fullscreen-icon .exit {
  display:none;
}

.stage.is-fullscreen .fullscreen-icon .enter {
  display:none;
}

.stage.is-fullscreen .fullscreen-icon .exit {
  display:block;
}

/* ===== LOADER ===== */
.player-loader {
  position:absolute;
  inset:0;
  z-index:12;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  gap:12px;
  transition:opacity .4s;
  color:#cfcbdb;
  font-size:12px;
}

.player-loader.hidden {
  opacity:0;
  pointer-events:none;
}

.spinner {
  width:36px;
  height:36px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--accent2);
  border-radius:50%;
  animation:spin .9s linear infinite;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

/* ===== CENTER PLAY ===== */
.center-play {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.92);
  z-index:7;
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(20,18,28,.72);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s,background .2s;
  backdrop-filter:blur(8px);
}

.stage.paused .center-play,
.stage.ready .center-play {
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}

.center-play:hover {
  background:var(--accent);
}

.center-play svg {
  width:24px;
  height:24px;
  fill:currentColor;
  margin-left:3px;
}

/* ===== INFO ===== */
.info {
  padding:16px 16px 13px;
}

.info h1 {
  font-size:19px;
  font-weight:700;
  margin-bottom:4px;
  line-height:1.35;
}

.info .meta {
  font-size:12.5px;
  color:var(--muted);
}

/* ===== ACTION BUTTONS ===== */
.icon-row {
  display:flex;
  padding:4px 16px 18px;
  border-bottom:1px solid var(--border);
}

.icon-btn {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  background:none;
  border:0;
  cursor:pointer;
  color:var(--text);
  font-family:'Poppins',sans-serif;
}

.icon-btn .circle {
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s,transform .2s,box-shadow .2s;
}

.icon-btn:hover .circle {
  background:var(--glow);
  transform:translateY(-2px);
  box-shadow:0 6px 18px var(--glow);
}

.icon-btn svg {
  width:20px;
  height:20px;
  fill:none;
  stroke:var(--accent2);
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-btn span:last-child {
  font-size:11.5px;
  color:var(--muted);
}

/* ===== ERROR ===== */
.error-box {
  text-align:center;
  padding:20px;
  max-width:320px;
  color:#fff;
}

.error-box b {
  display:block;
  font-size:17px;
  margin-bottom:6px;
}

.error-box small {
  display:block;
  color:#bbb4c8;
  font-size:12px;
  line-height:1.5;
  word-break:break-word;
}

.error-box button {
  margin-top:16px;
  border:0;
  border-radius:10px;
  padding:9px 18px;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:700;
  cursor:pointer;
}

/* ===== MODAL ===== */
.modal {
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.modal.hidden {
  display:none!important;
}

.modal-content {
  width:100%;
  max-width:390px;
  padding:27px 22px 22px;
  border-radius:20px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  border:1px solid var(--border-strong);
  box-shadow:0 25px 80px rgba(0,0,0,.4);
  text-align:center;
  animation:modalIn .25s ease;
}

@keyframes modalIn {
  from { opacity:0; transform:scale(.96) translateY(8px); }
  to { opacity:1; transform:scale(1) translateY(0); }
}

.modal-content h2 {
  font-size:21px;
  margin-bottom:8px;
}

.modal-content p {
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  margin-bottom:20px;
}

.modal-actions {
  display:flex;
  flex-direction:column;
  gap:9px;
}

.modal-primary,
.modal-secondary {
  width:100%;
  border:0;
  border-radius:11px;
  padding:11px 14px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.modal-primary {
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:0 10px 25px -12px var(--glow);
}

.modal-secondary {
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
}

/* ===== TOAST ===== */
.toast {
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(15px);
  z-index:20000;
  padding:9px 16px;
  border-radius:100px;
  background:var(--surface);
  border:1px solid var(--border-strong);
  color:var(--text);
  font-size:12px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s,transform .25s;
  white-space:nowrap;
  box-shadow:0 14px 35px rgba(0,0,0,.25);
}

.toast.show {
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ===== FULLSCREEN ===== */
.stage:fullscreen {
  border-radius:0;
  width:100vw;
  height:100vh;
  padding-top:0;
  border:0;
}

.stage:-webkit-full-screen {
  border-radius:0;
  width:100vw;
  height:100vh;
  padding-top:0;
  border:0;
}

.stage:fullscreen #video,
.stage:-webkit-full-screen #video {
  width:100%;
  height:100%;
}

/* ===== LIVE DOT (top bar) ===== */
.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px rgba(239,68,68,.6);
  animation:blink 1.2s infinite;
  flex:0 0 auto;
}

/* ===== BELOW-PLAYER SECTIONS ===== */
.section-block{
  padding:18px 16px 4px;
}

.section-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:10px;
}

.divider-label{
  text-align:center;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.5px;
  color:var(--muted);
  text-transform:uppercase;
  margin:22px 16px 4px;
  position:relative;
}

.divider-label::before{
  content:"";
  position:absolute;
  left:0;right:0;top:50%;
  border-top:1px solid var(--border);
  z-index:0;
}

.divider-label span{
  position:relative;
  z-index:1;
  background:var(--bg);
  padding:0 10px;
}

.tg-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:14px;
  background:var(--surface);
  border:1px solid var(--border);
  text-decoration:none;
  color:var(--text);
  transition:transform .2s,border .2s,box-shadow .2s;
}

.tg-card:hover{
  transform:translateY(-1px);
  border-color:var(--border-strong);
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.tg-icon{
  width:42px;
  height:42px;
  flex:0 0 auto;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.tg-icon svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.tg-info{
  flex:1;
  min-width:0;
}

.tg-info h3{
  font-size:14.5px;
  font-weight:700;
  margin-bottom:2px;
}

.tg-info p{
  font-size:12px;
  color:var(--muted);
}

.tg-arrow{
  width:30px;
  height:30px;
  flex:0 0 auto;
  border-radius:50%;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
}

.tg-arrow svg{
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.share-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:0;
  border-radius:13px;
  padding:14px 16px;
  font-size:14.5px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 14px 30px -14px var(--glow);
  cursor:pointer;
  font-family:'Poppins',sans-serif;
}

.share-btn svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.footer-credit{
  text-align:center;
  padding:26px 16px 4px;
  font-size:12px;
  color:var(--muted);
}

.footer-credit b{
  color:var(--text);
}

/* ===== MOBILE ===== */
@media (max-width:520px) {
  .page {
    max-width:520px;
  }

  .topbar {
    padding:13px 14px;
  }

  .stage {
    border-radius:0;
    border-left:0;
    border-right:0;
  }

  .info {
    padding-left:14px;
    padding-right:14px;
  }

  .icon-row {
    padding-left:10px;
    padding-right:10px;
  }

  .volume {
    display:none;
  }

  .custom-controls {
    opacity:1;
    transform:none;
  }
}

@media (prefers-reduced-motion:reduce) {
  * {
    animation-duration:.001ms!important;
    transition-duration:.001ms!important;
  }
}
@media (max-width:560px){.topbar{min-height:72px;padding:10px}.top-actions{gap:4px}.top-action{width:34px;height:34px}.toggle{width:40px;height:40px}.brand .t{font-size:16px}}
</style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <div class="brand-center">
      <a class="brand" href="https://t.me/+DS9ZiVCYGX4yMzRl" target="_blank" rel="noopener noreferrer">
        <span class="dot" aria-hidden="true"></span><span class="t">TOXIFY</span>
      </a>
      <span class="brand-live">LIVE</span>
    </div>
    <div class="top-actions">
      <span class="live-dot" aria-hidden="true"></span>
      <button class="toggle" id="themeToggle" aria-label="Switch theme" aria-pressed="false">
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path></svg>
        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l-1.42 1.42M17.65 6.35l1.42-1.42"></path></svg>
      </button>
    </div>
  </div>

  <div class="stage ready" id="playerContainer" role="region" aria-label="Live stream player">

    <div class="stage-tag">
      <span class="dot"></span>
      LIVE
    </div>

    <video id="video" autoplay muted playsinline preload="auto"></video>

    <button class="center-play" id="centerPlay" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"></path></svg>
    </button>

    <div class="player-loader" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <span>Loading stream…</span>
    </div>

    <div class="custom-controls" id="customControls">
      <button class="control-btn" id="playBtn" aria-label="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"></path></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14M16 5v14"></path></svg>
      </button>

      <div class="volume-wrap">
        <button class="control-btn" id="muteBtn" aria-label="Mute">
          <svg id="volumeIcon" viewBox="0 0 24 24">
            <path d="M4 9v6h4l5 4V5L8 9z"></path>
            <path d="M17 9.5a4 4 0 0 1 0 5"></path>
          </svg>
        </button>
        <input class="volume" id="volumeSlider" type="range" min="0" max="1" step=".05" value="0">
      </div>

      <span class="live-control">LIVE</span>

<div class="modal" id="joinModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <h2 id="modalTitle">Join Telegram</h2>
    <p>Join Telegram for live links & match updates!</p>
    <div class="modal-actions">
      <button class="modal-primary" id="joinButton">Join Telegram Channel</button>
      <button class="modal-secondary" id="closeButton">Already joined</button>
    </div>
  </div>

<div class="toast" id="toast" role="status" aria-live="polite">Link copied to clipboard</div>

<script>

const DATA_URL = "https://raw.githubusercontent.com/drmlive/fancode-live-events/refs/heads/main/fancode.json";

/* ================================
   ELEMENTS & VARS
================================ */
const params = new URLSearchParams(window.location.search);
const matchId = params.get("id");
const video = document.getElementById("video");
const loading = document.getElementById("loading");
const modal = document.getElementById("joinModal");
const toast = document.getElementById("toast");
let hls = null;

/* ================================
   THEME (synced with index.html)
================================ */
function initTheme() {
    let theme = "dark";
    try { theme = localStorage.getItem("cxp_theme") || "dark"; } catch (_) {}
    document.documentElement.setAttribute("data-theme", theme);
}
function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    const next = current === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("cxp_theme", next); } catch (_) {}
}
initTheme();
document.getElementById("themeToggle").addEventListener("click", toggleTheme);

/* ================================
   MODAL POPUP LOGIC
================================ */
function dismissModal() {
    if (!modal) return;
    modal.classList.add("hidden");
    try { sessionStorage.setItem("cxp_joined", "1"); } catch (_) {}
}

modal.addEventListener("click", function (e) {
    if (e.target === modal) dismissModal();
});

document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modal && !modal.classList.contains("hidden")) dismissModal();
});

document.getElementById("joinButton").addEventListener("click", function () {
    window.open("https://t.me/+DS9ZiVCYGX4yMzRl", "_blank", "noopener,noreferrer");
    dismissModal();
});

document.getElementById("closeButton").addEventListener("click", dismissModal);

try {
    if (sessionStorage.getItem("cxp_joined") === "1") {
        modal.classList.add("hidden");
    }
} catch (_) {}

/* ================================
   TOAST LOGIC
================================ */
function showToast(text) {
    if (text) toast.textContent = text;
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 2500);
}

/* ================================
   ESCAPE HTML & ERROR HANDLING
================================ */
function escapeHtml(value){
    return String(value ?? "")
        .replace(/[&<>"']/g, function(c){
            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[c];
        });
}

function showError(message){
    loading.innerHTML = `
        <div class="error-box">
            <b>Unable to load stream</b>
            <small>${escapeHtml(message)}</small>
            <button id="retryBtn">Retry</button>
        </div>
    `;
    loading.style.display = "flex";
    const retryBtn = document.getElementById("retryBtn");
    if (retryBtn) retryBtn.addEventListener("click", function () {
        loading.innerHTML = `<div class="spinner"></div><div>Analyzing the video...</div>`;
        initPlayer();
    });
}

/* ================================
   GET MATCH — try data handed off from index.html first,
   fall back to fetching the JSON if it's missing or stale.
================================ */
async function getMatch(){
    if(!matchId){
        throw new Error("Match ID missing");
    }

    try {
        const cached = sessionStorage.getItem("cxp_match_" + matchId);
        if (cached) {
            console.log("Using match data handed off from index page");
            return JSON.parse(cached);
        }
    } catch (_) { /* fall through to fetch */ }

    console.log("Requested Match ID:", matchId);

    const response = await fetch(DATA_URL,{
        method:"GET",
        cache:"no-store"
    });

    if(!response.ok){
        throw new Error("Failed to fetch Fancode JSON: HTTP " + response.status);
    }

    const data = await response.json();
    const matches = Array.isArray(data.matches) ? data.matches : [];

    const match = matches.find(function(m){
        return String(m.match_id).toLowerCase() === String(matchId).toLowerCase();
    });

    if(!match){
        throw new Error("Match not found: " + matchId);
    }

    console.log("Match found:", match);
    return match;
}

/* ================================
   LOAD HLS PLAYER
================================ */
async function initPlayer(){
    try {
        const match = await getMatch();
        const streamUrl = match.adfree_url || match.dai_url;

        if(!streamUrl){
            throw new Error("No HLS stream available for this match");
        }

        console.log("Stream URL:", streamUrl);

        /* NATIVE HLS */
        if(video.canPlayType("application/vnd.apple.mpegurl")){
            console.log("Using native HLS");
            video.src = streamUrl;

            video.addEventListener("loadedmetadata", function(){
                loading.style.display = "none";
                video.play().catch(function(){
                    video.muted = true;
                    video.play().catch(function(){});
                });
            }, {once:true});

            video.addEventListener("error", function(){
                showError("The HLS stream could not be played.");
            }, {once:true});

            return;
        }

        /* HLS.JS SUPPORT CHECK */
        if(!Hls.isSupported()){
            throw new Error("HLS is not supported by this browser.");
        }

        console.log("Using hls.js");

        hls = new Hls({
            enableWorker:true,
            lowLatencyMode:true,
            backBufferLength:30,
            maxBufferLength:30,
            maxMaxBufferLength:60,
            liveSyncDurationCount:3,
            liveMaxLatencyDurationCount:6,
            manifestLoadingMaxRetry:5,
            levelLoadingMaxRetry:5,
            fragLoadingMaxRetry:5
        });

        hls.attachMedia(video);

        hls.on(Hls.Events.MEDIA_ATTACHED, function(){
            console.log("HLS media attached");
            hls.loadSource(streamUrl);
        });

        hls.on(Hls.Events.MANIFEST_PARSED, function(){
            console.log("HLS manifest parsed");
            loading.style.display = "none";
            video.play().catch(function(){
                video.muted = true;
                video.play().catch(function(){});
            });
        });

        video.addEventListener("playing", function(){
            loading.style.display = "none";
        });

        hls.on(Hls.Events.ERROR, function(event, data){
            console.error("HLS Error:", data);
            if(!data.fatal) return;

            switch(data.type){
                case Hls.ErrorTypes.NETWORK_ERROR:
                    console.log("Network error - retrying...");
                    try { hls.startLoad(); } catch(e) { console.error(e); }
                    break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                    console.log("Media error - recovering...");
                    try { hls.recoverMediaError(); } catch(e) { console.error(e); }
                    break;
                default:
                    showError("Fatal HLS error. The stream is unavailable.");
                    destroyHls();
                    break;
            }
        });

    } catch(error) {
        console.error("Player error:", error);
        showError(error.message);
    }
}

/* ================================
   CLEANUP
================================ */
function destroyHls(){
    if(hls){
        try { hls.destroy(); } catch(e) { console.error(e); }
        hls = null;
    }
}

window.addEventListener("beforeunload", destroyHls);

/* ================================
   START PLAYER
================================ */
if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", initPlayer);
} else {
    initPlayer();
}

</script>

<script>
/* ===== KOHLIFY-STYLE PLAYER UI ===== */
(function(){
  const stage = document.getElementById("playerContainer");
  const video = document.getElementById("video");
  const playBtn = document.getElementById("playBtn");
  const centerPlay = document.getElementById("centerPlay");
  const muteBtn = document.getElementById("muteBtn");
  const volumeSlider = document.getElementById("volumeSlider");
  const fullscreenBtn = document.getElementById("fullscreenBtn");
  const shareBtn = document.getElementById("shareStreamBtn");
  const playIcon = document.getElementById("playIcon");
  const pauseIcon = document.getElementById("pauseIcon");
  const toast = document.getElementById("toast");

  function setPlayState(){
    const paused = video.paused;
    playIcon.style.display = paused ? "block" : "none";
    pauseIcon.style.display = paused ? "none" : "block";
    stage.classList.toggle("paused", paused);
    stage.classList.toggle("ready", paused);
  }

  function togglePlay(){
    if(video.paused){
      video.play().catch(()=>{});
    } else {
      video.pause();
    }
  }

  playBtn.addEventListener("click", togglePlay);
  centerPlay.addEventListener("click", togglePlay);
  video.addEventListener("play", setPlayState);
  video.addEventListener("pause", setPlayState);
  video.addEventListener("playing", setPlayState);
  video.addEventListener("loadeddata", setPlayState);

  /* Keep the speaker icon in sync with autoplay mute and user changes. */
  const volumeIcon = document.getElementById("volumeIcon");
  function updateVolumeState(){
    const isMuted = video.muted || video.volume === 0;
    volumeIcon.innerHTML = isMuted
      ? '<path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M17 9l5 6m0-6l-5 6"></path>'
      : '<path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M17 9.5a4 4 0 0 1 0 5"></path>';
    muteBtn.setAttribute("aria-label", isMuted ? "Unmute" : "Mute");
    muteBtn.setAttribute("title", isMuted ? "Click to unmute" : "Click to mute");
    muteBtn.setAttribute("aria-pressed", String(isMuted));
    volumeSlider.value = isMuted ? 0 : video.volume;
  }

  muteBtn.addEventListener("click", function(){
    video.muted = !video.muted;
    if(!video.muted && video.volume === 0) video.volume = .7;
    updateVolumeState();
    showPlayerToast(video.muted ? "Muted" : "Sound on");
  });

  volumeSlider.addEventListener("input", function(){
    const v = Number(this.value);
    video.volume = v;
    video.muted = v === 0;
    updateVolumeState();
  });
  video.addEventListener("volumechange", updateVolumeState);
  updateVolumeState();

  function updateFullscreenState(){
    const active = document.fullscreenElement === stage ||
      document.webkitFullscreenElement === stage;
    stage.classList.toggle("is-fullscreen", active);
  }

  async function goFullscreen(){
    try{
      if(document.fullscreenElement || document.webkitFullscreenElement){
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else if(stage.requestFullscreen){
        await stage.requestFullscreen();
      } else if(stage.webkitRequestFullscreen){
        stage.webkitRequestFullscreen();
      }
    }catch(e){
      showPlayerToast("Fullscreen unavailable");
    }
    updateFullscreenState();
  }

  fullscreenBtn.addEventListener("click", goFullscreen);
  document.addEventListener("fullscreenchange", updateFullscreenState);
  document.addEventListener("webkitfullscreenchange", updateFullscreenState);

  shareBtn.addEventListener("click", async function(){
    try{
      if(navigator.share){
        await navigator.share({
          title:"Toxify Live",
          text:"Watch this live stream on Toxify",
          url:window.location.href
        });
      }else{
        await navigator.clipboard.writeText(window.location.href);
        showPlayerToast("Link copied");
      }
    }catch(e){
      if(e && e.name !== "AbortError"){
        try{
          await navigator.clipboard.writeText(window.location.href);
          showPlayerToast("Link copied");
        }catch(_){}
      }
    }
  });

  function showPlayerToast(text){
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(window.__playerToastTimer);
    window.__playerToastTimer = setTimeout(function(){
      toast.classList.remove("show");
    },2200);
  }

  /* Keep the player controls visible briefly after touch interaction. */
  let hideTimer;
  function revealControls(){
    stage.classList.add("controls-visible");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      if(!video.paused) stage.classList.remove("controls-visible");
    },3000);
  }

  stage.addEventListener("touchstart", revealControls, {passive:true});
  stage.addEventListener("mousemove", function(){
    stage.classList.add("controls-visible");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      if(!video.paused) stage.classList.remove("controls-visible");
    },1800);
  });

  /* The original initPlayer already started during page load. */
  setPlayState();
})();
</script>

</body>
